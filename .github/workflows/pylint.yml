name: pylint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install kuberd and pylint
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Full report for reference: conventions and warnings never fail the job.
      - name: pylint report
        run: pylint --exit-zero kuberd

      # The job fails only on errors (likely bugs).
      - name: pylint errors
        run: pylint --errors-only kuberd
